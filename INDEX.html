<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>E-LIVE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:url("fondo.png");
background-size:cover;
background-position:center;

font-family:Arial,Helvetica,sans-serif;
}


/* PANEL */

.login-card{

width:430px;
height:480px;

background:#2A001F;

border-radius:
30px 0px
30px 0px;

padding:40px 50px;

position:relative;

overflow:hidden;

}


/* HEXAGONOS */

.login-card::after{

content:"";

position:absolute;

right:-30px;
bottom:-30px;

width:250px;
height:250px;

background:url("hexagonos.png");
background-size:contain;
background-repeat:no-repeat;

opacity:.2;

}


.logo{

display:block;

width:145px;

margin:auto;

margin-bottom:35px;

}


h2{

color:white;

text-align:center;

font-size:22px;

margin-bottom:28px;

letter-spacing:1px;

font-weight:600;

}


label{

display:block;

color:white;

font-size:12px;

font-weight:bold;

margin-bottom:8px;

letter-spacing:.5px;

}


input[type=text],
input[type=password]{

width:100%;

height:46px;

background:white;

border:none;

outline:none;

padding-left:15px;

margin-bottom:22px;

border-radius:
0 18px
0 18px;

font-size:14px;

}


.remember{

display:flex;

align-items:center;

gap:10px;

margin-bottom:30px;

}


.remember span{

color:white;

font-size:11px;

font-weight:600;

}


.remember input{

width:18px;
height:18px;

}


/* ESPACIO PARA BOTONES DE INDESIGN */

.botones-placeholder{

height:60px;

margin-bottom:25px;

}


/* ESPACIO PARA ENLACE */

.olvido-placeholder{

height:20px;

}


</style>
</head>

<body>

<div class="login-card">

<img src="logo-elive.png" class="logo">

<h2>INICIA SESIÓN</h2>

<form>

<label>USUARIO</label>
<input type="text">

<label>CONTRASEÑA</label>
<input type="password">

<div class="remember">

<input type="checkbox">

<span>MANTENERME CONECTADO</span>

</div>

<!-- ESPACIO PARA BOTONES -->
<div class="botones-placeholder"></div>

<!-- ESPACIO PARA ¿Olvidó contraseña? -->
<div class="olvido-placeholder"></div>

</form>

</div>

</body>
</html>
